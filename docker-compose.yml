services:
  mongo:
    image: mongo:8.0.0
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - 27017:27017
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - 'mongo-data:/data/db'
      - 'mongo-config:/data/configdb'

  redis:
    image: redis:7.4.2-alpine
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      timeout: 20s
      retries: 10
    volumes:
      - redis-data:/var/lib/redis/data
    environment:
      REDIS_PASSWORD: dev
    command: /bin/sh -c 'redis-server --appendonly yes --requirepass $$REDIS_PASSWORD'

  stripe-cli:
    image: stripe/stripe-cli
    command: 'listen --api-key ${STRIPE_SECRET_KEY} --forward-to http://host.docker.internal:${PORT}/v1/purchase/webhook'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  mongo-data:
  mongo-config:
  redis-data:
